; configd actions for os-trusttunnel.
;
; Server actions are no-arg singletons; the endpoint serves all users
; from one credentials.toml. Reconfigure chains: materialize cert/key
; from Trust store, render TOMLs from config.xml, restart service.
;
; Client actions are also no-arg (one active server at a time per host).

[server.start]
command: /usr/local/etc/rc.d/trusttunnel_endpoint onestart
parameters:
type: script
message: starting TrustTunnel endpoint
description: Start the TrustTunnel endpoint

[server.stop]
command: /usr/local/etc/rc.d/trusttunnel_endpoint onestop
parameters:
type: script
message: stopping TrustTunnel endpoint
description: Stop the TrustTunnel endpoint

[server.restart]
command: /usr/local/etc/rc.d/trusttunnel_endpoint onerestart
parameters:
type: script
message: restarting TrustTunnel endpoint
description: Restart the TrustTunnel endpoint

[server.status]
command: /usr/local/etc/rc.d/trusttunnel_endpoint onestatus
parameters:
type: script
message: TrustTunnel endpoint status
description: Status of the TrustTunnel endpoint

[server.reconfigure]
command: /usr/local/opnsense/scripts/trusttunnel/materialize_certs.php && /usr/local/bin/python3 /usr/local/opnsense/scripts/trusttunnel/render_server_config.py && /usr/local/etc/rc.d/trusttunnel_endpoint onerestart
parameters:
type: script
message: reconfiguring TrustTunnel endpoint
description: Materialize certs, render TOMLs from config.xml, restart endpoint

[server.export_deeplink]
command: /usr/local/bin/python3 /usr/local/opnsense/scripts/trusttunnel/deeplink_export.py --user=%s
parameters: %s
type: script_output
message: exporting TrustTunnel deeplink for user %s
description: Generate tt:// deeplink + QR PNG for the named user (JSON)

; ---------------------------------------------------------------------------
; Client actions (Task 9 fills in render_client_config.py)
; ---------------------------------------------------------------------------

[client.start]
command: /usr/local/etc/rc.d/trusttunnel_client onestart
parameters:
type: script
message: starting TrustTunnel client
description: Start the TrustTunnel client

[client.stop]
command: /usr/local/etc/rc.d/trusttunnel_client onestop
parameters:
type: script
message: stopping TrustTunnel client
description: Stop the TrustTunnel client

[client.restart]
command: /usr/local/etc/rc.d/trusttunnel_client onerestart
parameters:
type: script
message: restarting TrustTunnel client
description: Restart the TrustTunnel client

[client.status]
command: /usr/local/etc/rc.d/trusttunnel_client onestatus
parameters:
type: script
message: TrustTunnel client status
description: Status of the TrustTunnel client

[client.reconfigure]
command: /usr/local/bin/python3 /usr/local/opnsense/scripts/trusttunnel/render_client_config.py && /usr/local/etc/rc.d/trusttunnel_client onerestart
parameters:
type: script
message: reconfiguring TrustTunnel client
description: Render trusttunnel_client.toml from config.xml, restart client
